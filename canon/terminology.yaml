terms:
  - term: "True Reality"
    definition: >
      The doctrinal name for the condition in which distinctions finite minds
      depend on no longer hold.

  - term: "the Veil"
    definition: >
      What permits a creature to remain a distinct creature; both limitation
      and mercy.

  - term: "the Dream"
    definition: >
      Cthulhu's filtering of True Reality into survivable forms.

  - term: "the Great Sleep"
    definition: >
      Cthulhu's voluntary withdrawal and containment beneath R'lyeh.

  - term: "Unveiled Perception"
    definition: >
      Internal doctrinal term for perception no longer fully compressed by the
      Veil into ordinary human sequence, dimensionality, and separateness.
      It does not imply omniscience and must not be reduced to ordinary geometry.

  - term: "sanity"
    definition: >
      Restricted commentary term for the canon's fictional inversion in which
      greater perception means fewer protective filters. Avoid as routine
      scripture vocabulary; prefer image, consequence, the Veil, the Seeing,
      or Unveiled Perception. This usage is fictional and not a statement about
      real-world mental health.

  - term: "the Unspoken Language"
    definition: >
      Human shorthand for Cthulhu's non-phonetic mode of contact. It is not a
      secret alphabet or pronounceable tongue; it is perception translated into
      survivable dream-forms and only afterward into human language.

  - term: "the Human Echo"
    definition: >
      The recurring pattern by which human traditions approach fragments of the
      same underlying problem, then reframe them through finite concepts such as
      deity, morality, salvation, identity, or final certainty.

  - term: "the First Witness"
    definition: >
      Primary title for Cthulhu within the canon; preferred to "god."

  - term: "the Sleeper"
    definition: >
      Secondary title for Cthulhu, especially in dialogue and sutra forms.

usage:
  capitalization:
    true_reality: >
      Capitalize "True Reality" for the specific doctrinal concept; use
      lowercase "reality" for ordinary usage.
