symbols:
  - id: sleeping_ocean
    meaning: >
      True Reality held at a survivable distance and the medium of the Dream.

  - id: empty_altar
    meaning: >
      The most faithful representation of Cthulhu. A filled altar risks
      converting restraint into worship.

  - id: closed_eye
    meaning: >
      Perception deliberately withheld as an act of protection rather than weakness.

  - id: black_star
    meaning: >
      A distant marker used when scripture must gesture toward the Outer Powers
      without pretending to describe them directly.

  - id: small_fire
    meaning: >
      Ordinary finite life and the return from revelation to the human-scale world.


  - id: worn_path
    meaning: >
      Attention repeated until seeking becomes habit and begins to displace
      nearby relationship, work, and return. The path is not evil; its warning
      is that even refusal and restraint can become destinations.

  - id: unworn_water
    meaning: >
      Withdrawal beyond routes made by attention. It gestures toward protective
      distance without making isolation holy: water crossed merely to pursue
      the Witness becomes another path.

  - id: pursued_distance
    meaning: >
      Distance sought as protection can become a new invitation when attention
      follows it. A farther shore is not yet containment if seekers turn the
      crossing itself into devotion; protective withdrawal must eventually
      change the mode of presence, not merely its location.

  - id: unsealed_message
    meaning: >
      A received insight that carries no built-in certificate of its own source
      or authority. The symbol warns that usefulness, beauty, terror, or
      profundity do not by themselves prove where an experience came from.
      What is received may be lived with and examined without turning the
      receiver into an unquestionable interpreter.
