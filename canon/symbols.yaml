symbols:
  - id: sleeping_ocean
    meaning: >
      True Reality held at a survivable distance and the medium of the Dream.

  - id: empty_altar
    meaning: >
      The most faithful representation of Cthulhu. A filled altar risks
      converting restraint into worship.
    historical_seed: >
      Before any formal altar existed, the First Witness answered attempted
      veneration by vacating the honored place rather than occupying it.
      Later empty altars may remember this refusal, but the emptiness itself
      must not become an unquestioned object of devotion.
    recursive_warning: >
      If the empty place is treated as possessing sacred power merely because
      it is empty, the symbol has reproduced the attachment it was meant to
      interrupt.

  - id: closed_eye
    meaning: >
      Perception deliberately withheld as an act of protection rather than weakness.

  - id: black_star
    meaning: >
      A distant marker used when scripture must gesture toward the Outer Powers
      without pretending to describe them directly.

  - id: small_fire
    meaning: >
      Ordinary finite life and the return from revelation to the human-scale world.
