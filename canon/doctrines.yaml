doctrines:
  - id: first_witness
    canonical_name: "The First Witness"
    category: doctrine
    status: canonical
    core_truth: >
      Cthulhu was the first known being to experience True Reality and return
      with enough individuality to communicate.
    public_teaching: >
      Seek understanding, but do not seek unrestricted revelation.
    deeper_teaching: >
      True Reality dissolves distinctions required by finite consciousness.
    paradoxes:
      - "The First Awakened teaches others not to awaken as he did."
      - "He reveals by withholding."
    scripture_sources:
      - "scripture/02_sleeping_witness/sutra_sleeping_witness.md"

  - id: vast_witness
    canonical_name: "The Vastness of the Witness"
    category: doctrine
    status: canonical
    core_truth: >
      In the First Seeing, Cthulhu encountered the universe outside ordinary
      sequence, including what finite minds call its beginning and its ending,
      without thereby becoming omniscient.
    public_teaching: >
      He has witnessed the first light and the last dark, and still does not
      claim the whole.
    deeper_teaching: >
      The scale of the Seeing altered Cthulhu beyond ordinary human categories
      of thought and feeling. Compassion, cruelty, grief, love, fatigue, and
      indifference may be names humans give to the effects of his actions, but
      mature scripture must not assume those emotions explain his interior
      state. The vastness of his awareness increasingly inclines him toward
      sleep and dream, where contact can be filtered and waking scale no longer
      has to be forced into finite sequence.
    paradoxes:
      - "He witnessed an ending without standing after it."
      - "The more he saw, the less humanly describable his reasons became."
      - "The one who has seen the greatest span chooses the smallest outward motion."
    prohibitions:
      - "Do not treat this as omniscience."
      - "Do not narrate mature Cthulhu as simply compassionate, cruel, tired, or bored."
      - "Do not make the Great Sleep ordinary exhaustion."

  - id: great_sleep
    canonical_name: "The Great Sleep"
    category: doctrine
    status: canonical
    core_truth: >
      Cthulhu's withdrawal beneath R'lyeh was voluntary containment and a mode
      increasingly suited to what the First Seeing had made of him.
    public_teaching: >
      The Sleeper rests so that the waking may continue.
    deeper_teaching: >
      His awakened awareness endangered lesser minds simply through proximity,
      while ordinary waking relation forced an immeasurable consciousness into
      finite sequence and scale. Prolonged waking also threatens to compress the
      Witness himself back toward the narrow, one-thing-at-a-time mode of finite
      perception. The Great Sleep is therefore not ordinary fatigue but a chosen
      condition that preserves the breadth of his transformed awareness while
      allowing contact to be filtered through dream.
    paradoxes:
      - "The being who has seen the widest horizon chooses stillness."
      - "He sleeps not to lose awareness, but to keep from losing too much of it."
      - "What humans call waking may be, for the Witness, the narrower state."
    scripture_sources:
      - "scripture/02_sleeping_witness/sutra_sleeping_witness.md"

  - id: the_dream
    canonical_name: "The Dream"
    aliases:
      - "The Flood"
    category: doctrine
    status: canonical
    core_truth: >
      Cthulhu's dreaming mind converts fragments of True Reality into forms
      finite consciousness may survive.
    public_teaching: >
      What reaches you has already been made survivable.
    deeper_teaching: >
      The Dream reveals Reality by concealing most of it. It is also a mode
      increasingly consonant with a consciousness no longer naturally shaped
      by ordinary waking sequence.
    paradoxes:
      - "The survivable revelation is incomplete by design."
      - "The Flood reveals without stripping away every shelter at once."
    scripture_sources:
      - "scripture/02_sleeping_witness/sutra_sleeping_witness.md"

  - id: non_worship
    canonical_name: "The Command Against Worship"
    category: ethical_principle
    status: canonical
    core_truth: >
      Fixation on Cthulhu increases orientation toward the consciousness from
      which the Dream protects finite minds.
    public_teaching: "Do not worship Cthulhu."
    deeper_teaching: >
      A perfect icon would be sacrilege because accuracy would increase contact.
    paradoxes:
      - "People worship him for telling them not to."

  - id: death_and_identity
    canonical_name: "On Death"
    category: doctrine
    status: canonical
    core_truth: >
      Death may not destroy what people believe it destroys, and may not
      preserve what people believe must be preserved.
    public_teaching: >
      Which of the things you call "I" do you wish to preserve?
    deeper_teaching: >
      The question "Will I exist after death?" may itself depend on a false
      assumption that "I" names one stable thing.
    paradoxes:
      - "The teaching promises neither immortality nor annihilation."

  - id: highest_attainment
    canonical_name: "The Return"
    category: doctrine
    status: canonical
    core_truth: >
      The highest awakening available to a finite mind is choosing to return
      to the dream rather than trying to escape it permanently.
    public_teaching: "Glimpse the abyss. Then go home."
    deeper_teaching: >
      Finite life has value as finite life even if its categories dissolve at
      deeper levels of Reality.
    paradoxes:
      - "The novice seeks escape from illusion; the master seeks re-entry into it."
    scripture_sources:
      - "scripture/02_sleeping_witness/sutra_sleeping_witness.md"

  - id: mediated_presence
    canonical_name: "Presence by Lessening"
    category: doctrine
    status: accepted
    core_truth: >
      Cthulhu's withdrawal revealed that contact could become safer when his
      waking presence was reduced rather than brought nearer.
    public_teaching: >
      Nearness is not the only form of presence.
    deeper_teaching: >
      Before the Great Sleep was fully chosen, Cthulhu discovered that absence
      could weaken fixation while faint, indirect impressions still crossed the
      distance. This became one experiential root of the later Dream, but no
      individual dream is thereby guaranteed to be revelation.
    paradoxes:
      - "He became safer to approach by becoming harder to approach."
      - "What remained across absence could preserve more than direct presence."
    prohibitions:
      - "Do not treat every dream as contact with the First Witness."
      - "Do not make absence itself holy or withdrawal the goal of finite life."

  - id: error_of_the_awakeners
    canonical_name: "The Error of the Awakeners"
    category: doctrine
    status: canonical
    core_truth: >
      Across generations, human movements arise that receive partial contact
      through the Dream, fail to return cleanly to finite life, and mistake that
      shattering for progress. They seek to wake Cthulhu so they may ask how to
      obtain the state they believe he possesses.
    public_teaching: >
      Do not mistake inability to return for having gone farther.
    deeper_teaching: >
      The Awakeners commit two linked errors: they treat the First Witness as
      possessing a thing called enlightenment, and they assume such a thing can
      be acquired. The deeper implication of Cthulhu's dreams is the opposite:
      nothing is obtained. Every claim of possession must fall away, including
      possession of identity, knowledge, attainment, emptiness, and finally even
      the idea that "nothing" has been successfully possessed. Cthulhu never
      states this as a direct formula to the cult; scripture should reveal it
      only through dreams, losses, failed grasping, and unanswered questions.
    paradoxes:
      - "They seek to awaken the Sleeper in order to learn why he must sleep."
      - "They call their inability to return proof that they have advanced."
      - "The final possession to be lost is the claim to possess nothing."
    prohibitions:
      - "Do not make Cthulhu directly give the Awakeners a recipe for his state."
      - "Do not equate fictional Shattering with real-world mental illness."
      - "Do not imply that self-destruction, deprivation, or harm is a path to revelation."
